{% extends "base.html" %}
{% load static %}
{% block meta %}
    <title>Edit Project - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="project-section">
            <div class="container">
                <h1>Edit Project</h1>
                <form id="project-edit-form"
                      method="post"
                      action="{% url 'main:edit_project' project.id %}"
                      data-api-url="{% url 'api:project-detail' project.id %}"
                      data-redirect-url="{% url 'main:show_project' %}"
                      class="project-form" novalidate>
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="button">Save</button>
                    <a href="{% url 'main:show_project' %}" class="button button-secondary">Cancel</a>
                </form>
            </div>
        </section>
    </main>
    <script src="{% static 'js/project_edit.js' %}"></script>
{% endblock content %}
